# Shared nginx-proxy vhost for uid.ddecor.com
# Place at: /data/nginx-proxy/conf.d/uid.conf  then reload the proxy.
# Wildcard *.ddecor.com cert lives in /etc/nginx/certs (inside the proxy container).

server {
    listen 80;
    server_name uid.ddecor.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name uid.ddecor.com;

    ssl_certificate     /etc/nginx/certs/uid.ddecor.com.crt;
    ssl_certificate_key /etc/nginx/certs/uid.ddecor.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 20M;

    location / {
        # The ID Card app container (Node/Express) joins the proxy network
        # with alias `uid_app` and listens on 4000 — see docker-compose.prod.yml.
        proxy_pass         http://uid_app:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/uid_access.log;
    error_log  /var/log/nginx/uid_error.log;
}
